<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constitution of India — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#ffffff">
    <style>
        /* Small page-specific overrides so changes are non-breaking */
        .hero {
            min-height: 100vh;
            display: grid;
            place-items: center;
            /* stronger overlay to improve contrast against the flag background */
            background-image: linear-gradient(180deg, rgba(0,0,0,0.14), rgba(255,255,255,0.06)), url('https://upload.wikimedia.org/wikipedia/commons/4/41/Flag_of_India.svg');
            background-size: cover;
            background-position: center;
        }


        .card-right button {
  background: linear-gradient(135deg, #ff9933, #138808); /* Indian flag color vibe */
  color: #fff;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  padding: 14px 36px;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

/* Fancy hover effect */
.card-right button::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.2);
  transition: all 0.4s ease;
}

.card-right button:hover::before {
  left: 100%;
}

.card-right button:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

/* For smaller screens */
@media (max-width: 600px) {
  .card-right button {
    width: 100%;
    padding: 16px;
    font-size: 1rem;
  }
}

    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <a href="index.html" class="logo">Constitution<span class="accent">Lab</span></a>
                <small class="tag">Learn • Test • Explore</small>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="btn-icon" aria-label="Toggle theme">🌓</button>
            </div>
        </div>
    </header>

    <main class="hero">
        <section class="container login-card" aria-labelledby="login-heading">
            <div class="card-left">
                <h1 id="login-heading">Welcome back</h1>
                <p class="muted">Discover the spirit of India’s Constitution — learn, explore, and grow your knowledge.</p>
                <ul class="features">
                    <li>Curated articles and preamble</li>
                    <li>Interactive quizzes and results</li>
                    <li>Light / Dark theme</li>
                </ul>
            </div>

            <div class="card-right">
                <a href="main.html"><button>Get Started</button></a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 ConstitutionLab. Created for learning purposes.</p>
        </div>
    </footer>

    <script src="ui.js"></script>
</body>
</html>
